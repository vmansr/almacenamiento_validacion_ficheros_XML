version: '3.8'

services:
  existdb:
    image: existdb/existdb:latest
    container_name: existdb-xml-hr
    ports:
      - "8081:8080"
    volumes:
      - ./data:/exist/import
      - existdb-data:/exist/data
    environment:
      EXIST_DB_PASSWORD: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/exist/rest/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2

volumes:
  existdb-data: